[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_recaptcha"
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env, and
# requires.features_manual (dependencies invisible to static analysis).
[tool.splent.contract]
description = "Google reCAPTCHA protection for comment and contact forms"
archetype = "light"

[tool.splent.contract.provides]
routes     = ["/admin/captcha"]
blueprints = []
models     = []
commands   = ["hello"]
hooks      = ["layout.authenticated_sidebar"]
services   = ["CaptchaService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = ["settings"]
env_vars = ["RECAPTCHA_SECRET_KEY", "RECAPTCHA_SITE_KEY"]
signals  = ["comment-submitting", "contact-submitting"]

[tool.splent.contract.extensible]
services  = ["CaptchaService"]
templates = ["recaptcha/admin/settings.html"]
models    = []
hooks     = ["layout.authenticated_sidebar"]
routes    = false
