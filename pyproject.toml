[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_recaptcha"
version = "0.2.2"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "Google reCAPTCHA protection for comment and contact forms"
archetype = "light"

[tool.splent.contract.provides]
routes     = ["/admin/captcha"]
blueprints = []
models     = []
commands   = ["hello"]
hooks      = ["layout.authenticated_sidebar"]
services   = ["CaptchaService"]
signals    = []
translations = []
docker     = []

[tool.splent.contract.requires]
features = ["settings"]
env_vars = ["RECAPTCHA_SECRET_KEY", "RECAPTCHA_SITE_KEY"]
signals  = ["comment-submitting", "contact-submitting"]

[tool.splent.contract.extensible]
services  = ["CaptchaService"]
templates = ["recaptcha/admin/settings.html"]
models    = []
hooks     = ["layout.authenticated_sidebar"]
routes    = false

# ── Configuration ─────────────────────────────────────────────────────────
# The defaults are Google's documented reCAPTCHA v2 TEST keys, which always
# pass, so development works out of the box. A production product sets its
# real pair in its own .env, or from the admin panel, which wins at request
# time.
[tool.splent.config]
RECAPTCHA_SITE_KEY = "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
RECAPTCHA_SECRET_KEY = "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
